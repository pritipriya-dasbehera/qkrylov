name: Build and Release Julia Binaries

on:
  push:
    branches:
      - julia-release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag name (default: latest-binaries)'
        required: false
        default: 'latest-binaries'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: x86_64
          - platform: aarch64-linux-gnu
            os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
          - platform: x86_64-apple-darwin
            os: macos-13
            os_name: macos
            arch: x86_64
          - platform: aarch64-apple-darwin
            os: macos-14
            os_name: macos
            arch: aarch64
          - platform: x86_64-w64-mingw32
            os: windows-latest
            os_name: windows
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure and Build C++ Library
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQKRYLOV_BUILD_TESTS=OFF \
            -DQKRYLOV_BUILD_EXAMPLES=OFF \
            -DQKRYLOV_BUILD_PYTHON=OFF \
            -DCMAKE_INSTALL_PREFIX=artifact_staging
          cmake --build build --config Release -j 4
          cmake --install build --config Release

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Package Artifact and Compute Tree Hash
        shell: bash
        run: |
          julia -e '
          using Tar, SHA
          staging_dir = "artifact_staging"
          triple = "${{ matrix.platform }}"
          tarball = "qkrylov-$(triple).tar.gz"

          # Package staging directory into a tar.gz archive
          open(tarball, "w") do io
              Tar.create(staging_dir, io)
          end

          file_sha = bytes2hex(open(sha256, tarball))
          tree_sha = Tar.tree_hash(staging_dir)

          meta = """{
            "platform": "$(triple)",
            "os": "${{ matrix.os_name }}",
            "arch": "${{ matrix.arch }}",
            "tarball": "$(tarball)",
            "sha256": "$(file_sha)",
            "git_tree_sha1": "$(tree_sha)"
          }"""
          write("metadata-$(triple).json", meta)
          '

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            qkrylov-${{ matrix.platform }}.tar.gz
            metadata-${{ matrix.platform }}.json

  publish-and-update-artifacts:
    name: Publish Release & Update Artifacts.toml
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout julia-release branch
        uses: actions/checkout@v4
        with:
          ref: julia-release
          fetch-depth: 0

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="latest-binaries"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$TAG_NAME" qkrylov-*.tar.gz --clobber || \
          gh release create "$TAG_NAME" qkrylov-*.tar.gz \
            --title "Prebuilt Binaries ($TAG_NAME)" \
            --notes "Automated multi-platform native binary release for QuantumKrylov Julia bindings." \
            --target "$GITHUB_SHA"

      - name: Generate Artifacts.toml
        shell: bash
        run: |
          julia -e '
          repo = get(ENV, "GITHUB_REPOSITORY", "sjp95/qkrylov")
          tag = ENV["TAG_NAME"]

          meta_files = sort(filter(f -> startswith(f, "metadata-") && endswith(f, ".json"), readdir(".")))

          open("Artifacts.toml", "w") do io
              println(io, "# Auto-generated Artifacts.toml for QuantumKrylov ($tag)")
              for mf in meta_files
                  txt = read(mf, String)
                  platform = match(r"\"platform\":\s*\"([^\"]+)\"", txt)[1]
                  os = match(r"\"os\":\s*\"([^\"]+)\"", txt)[1]
                  arch = match(r"\"arch\":\s*\"([^\"]+)\"", txt)[1]
                  tarball = match(r"\"tarball\":\s*\"([^\"]+)\"", txt)[1]
                  sha256 = match(r"\"sha256\":\s*\"([^\"]+)\"", txt)[1]
                  tree_sha = match(r"\"git_tree_sha1\":\s*\"([^\"]+)\"", txt)[1]
                  url = "https://github.com/$(repo)/releases/download/$(tag)/$(tarball)"

                  println(io, "")
                  println(io, "[[libqkrylov]]")
                  println(io, "git-tree-sha1 = \"$(tree_sha)\"")
                  println(io, "")
                  println(io, "    [[libqkrylov.download]]")
                  println(io, "    url = \"$(url)\"")
                  println(io, "    sha256 = \"$(sha256)\"")
                  println(io, "")
                  println(io, "    [libqkrylov.os]")
                  println(io, "    os = \"$(os)\"")
                  println(io, "    arch = \"$(arch)\"")
              end
          end
          '
          cp Artifacts.toml bindings/julia/Artifacts.toml

      - name: Commit and Push Updated Artifacts.toml
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/julia/Artifacts.toml
          if ! git diff --staged --quiet; then
            git commit -m "Update Artifacts.toml for ${TAG_NAME} [skip ci]"
            git push origin julia-release
          else
            echo "Artifacts.toml is already up-to-date."
          fi
